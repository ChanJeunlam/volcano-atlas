# GitHub cron 使用 UTC；每月1日01:17 UTC = 北京时间09:17，避开整点拥挤。
name: Monthly GVP Data Refresh
on:
  schedule:
    - cron: '17 1 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh-and-publish:
    # 直接复用发布流程，避免 bot push 不触发另一个 workflow 而导致网站未更新。
    uses: ./.github/workflows/deploy-pages.yml
    with:
      refresh_data: true
